# ============================================================
# Analytics Hub - Spring Boot 4 Application Configuration
# Multi-Project Analytics Backend Service
# JDK 25 + Spring Boot 4.0.7
# ============================================================

spring:
  application:
    name: analyticshub-javaback
  
  # ============================================================
  # Database Configuration (System Database)
  # ============================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:analytics}?currentSchema=${DB_SCHEMA:analytics},public
    username: ${DB_USER:analytic}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: AnalyticsSystemPool
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:analytics}
    schemas: ${DB_SCHEMA:analytics}
    table: flyway_schema_history
    clean-disabled: true
    validate-on-migrate: true

  # Jackson Configuration
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    default-property-inclusion: non_null

  # Mail Configuration (SMTP)
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtpdm.aliyun.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}  # 发信地址，如：notify@mail.yourdomain.com
    password: ${MAIL_PASSWORD:}  # SMTP 密码
    properties:
      mail:
        smtp:
          auth: true
          # Bound each SMTP network operation so an outbox worker cannot remain
          # blocked near the default 300-second claim reclaim window.
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: true
            required: true
          ssl:
            enable: true

# MyBatis Plus Settings
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Route SQL logs through SLF4J so profile log levels control whether SQL and
    # bound parameters are emitted. Never write SQL directly to stdout in prod.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.github.analyticshub.entity

# ============================================================
# Server Configuration
# ============================================================
server:
  port: 3001
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    # MVC endpoints use the typed ApiResponse exception handler. Keep the
    # fallback error endpoint generic so filter/container failures cannot leak
    # exception messages or rejected request values.
    include-message: never
    include-binding-errors: never

# ============================================================
# Management & Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # /actuator/health is the only anonymous Actuator endpoint. Keep its
      # response intentionally minimal; detailed component paths require Admin Token.
      show-details: never
  health:
    defaults:
      enabled: true

# ============================================================
# Logging Configuration
# ============================================================
logging:
  level:
    root: INFO
    com.github.analyticshub: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# Application Custom Configuration
# ============================================================
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-API-Key,X-Device-ID,X-User-ID,X-Timestamp,X-Signature,X-App-Version,X-Project-ID,X-Admin-Token,X-Admin-OTP,X-Traffic-Token}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${APP_CORS_MAX_AGE:3600}

  json:
    # Bound parser work even for public endpoints that do not pass through the
    # HMAC request wrapper.
    max-nesting-depth: ${APP_JSON_MAX_NESTING_DEPTH:64}
    max-string-length: ${APP_JSON_MAX_STRING_LENGTH:262144}
    max-number-length: ${APP_JSON_MAX_NUMBER_LENGTH:128}
  
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    requests: ${APP_RATE_LIMIT_REQUESTS:100}
    window-ms: ${APP_RATE_LIMIT_WINDOW_MS:60000}
  
  security:
    admin-token: ${ADMIN_TOKEN:}
    actor-link:
      # 单机部署时业务后端可通过 loopback 调用；调用方列表通过外部配置注入。
      enabled: ${ACTOR_LINK_ENABLED:false}
      require-loopback: ${ACTOR_LINK_REQUIRE_LOOPBACK:true}
      signature-validity-ms: ${ACTOR_LINK_SIGNATURE_VALIDITY_MS:300000}
      max-request-body-bytes: ${ACTOR_LINK_MAX_REQUEST_BODY_BYTES:16384}
      clients: []
    # 签名有效期（毫秒）
    signature-validity-ms: 300000
    # HMAC validation needs a repeatable body, so cap its in-memory copy before
    # reading the request. The stream is also counted when Content-Length is absent.
    max-request-body-bytes: ${APP_SECURITY_MAX_REQUEST_BODY_BYTES:1048576}
    # Forwarded client-IP headers are trusted only from these immediate proxy
    # networks. The bundled Nginx deployment proxies from loopback.
    trusted-proxies: ${APP_SECURITY_TRUSTED_PROXIES:127.0.0.1,::1}
    # Compatibility escape hatch only. Public re-registration can let anyone
    # who knows a device UUID replace that device's credentials.
    allow-insecure-device-reregistration: ${ALLOW_INSECURE_DEVICE_REREGISTRATION:false}
    # Previous authenticated credentials remain valid briefly so a lost rotate
    # response can be retried without public re-registration.
    credential-rotation-grace-seconds: ${CREDENTIAL_ROTATION_GRACE_SECONDS:600}
    project-credentials:
      # Base64-encoded 32-byte AES key. Keep it outside the database and back it
      # up with the database; losing it makes encrypted project passwords unreadable.
      encryption-key: ${PROJECT_CREDENTIAL_ENCRYPTION_KEY:}
      # During key rotation, put the old key here for one successful startup.
      previous-encryption-key: ${PROJECT_CREDENTIAL_PREVIOUS_ENCRYPTION_KEY:}

  traffic:
    ip-hash-salt: ${TRAFFIC_IP_HASH_SALT:}
    public-token: ${TRAFFIC_PUBLIC_TOKEN:}
    # 仅这些运维显式声明的官网 Host 可保留 Referer 路径；其他绝对地址只保留 Host。
    # 不使用请求 Host 判断同源，避免调用方伪造 Host 泄露外部 Referer 路径。
    same-origin-hosts: ${TRAFFIC_SAME_ORIGIN_HOSTS:}

  email:
    alert-recipient: ${ALERT_EMAIL:}  # 安全告警接收邮箱

  work-order:
    outbox:
      # PROCESSING rows older than this can be reclaimed after a worker crash.
      claim-timeout-seconds: ${WORK_ORDER_OUTBOX_CLAIM_TIMEOUT_SECONDS:300}
      retry-delay-seconds: ${WORK_ORDER_OUTBOX_RETRY_DELAY_SECONDS:60}
      scheduler-enabled: ${WORK_ORDER_OUTBOX_SCHEDULER_ENABLED:true}
      scheduler-initial-delay-ms: ${WORK_ORDER_OUTBOX_SCHEDULER_INITIAL_DELAY_MS:30000}
      scheduler-fixed-delay-ms: ${WORK_ORDER_OUTBOX_SCHEDULER_FIXED_DELAY_MS:60000}
      scheduler-batch-size: ${WORK_ORDER_OUTBOX_SCHEDULER_BATCH_SIZE:20}

  analytics:
    query:
      # 交互式分析必须返回完整结果；超出预算时明确拒绝，绝不截断后冒充完整报表。
      max-range-days: ${ANALYTICS_QUERY_MAX_RANGE_DAYS:180}
      max-candidate-rows: ${ANALYTICS_QUERY_MAX_CANDIDATE_ROWS:200000}
      max-data-quality-rows: ${ANALYTICS_QUERY_MAX_DATA_QUALITY_ROWS:50000}
      max-funnel-groups: ${ANALYTICS_QUERY_MAX_FUNNEL_GROUPS:1000}
      max-dimension-value-length: ${ANALYTICS_QUERY_MAX_DIMENSION_VALUE_LENGTH:256}
      timeout-seconds: ${ANALYTICS_QUERY_TIMEOUT_SECONDS:15}
    event-property-backfill:
      # V8 之前的事件在服务启动后小批次补齐查询元数据，不进入 Flyway 启动事务。
      enabled: ${EVENT_PROPERTY_BACKFILL_ENABLED:true}
      initial-delay-ms: ${EVENT_PROPERTY_BACKFILL_INITIAL_DELAY_MS:1000}
      fixed-delay-ms: ${EVENT_PROPERTY_BACKFILL_FIXED_DELAY_MS:5000}
      batch-size: ${EVENT_PROPERTY_BACKFILL_BATCH_SIZE:20}
      max-batches-per-run: ${EVENT_PROPERTY_BACKFILL_MAX_BATCHES_PER_RUN:10}

  project-datasource:
    # Pools are created lazily per project. Keep minimumIdle at zero so an
    # operations center with many projects does not reserve N connections each.
    maximum-pool-size: ${PROJECT_DATASOURCE_MAXIMUM_POOL_SIZE:5}
    minimum-idle: ${PROJECT_DATASOURCE_MINIMUM_IDLE:0}

# 多项目数据源配置（从环境变量读取）
analytics:
  datasource:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:analytics}
    username: ${DB_USER:analytic}
    password: ${DB_PASSWORD:}

---
# ============================================================
# Development Profile
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  
  flyway:
    clean-disabled: false

logging:
  level:
    com.github.analyticshub: DEBUG

---
# ============================================================
# Production Profile
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

server:
  # Production traffic enters through the bundled loopback Nginx proxy.
  # Do not expose the application port directly to the public network.
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    root: WARN
    com.github.analyticshub: INFO
