name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: pom.xml

      - name: Verify Java project
        run: ./scripts/mvn-project --batch-mode --no-transfer-progress clean verify

      - name: Test operations scripts
        run: bash ops/tests/run.sh

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n ops/analyticshub
          for file in ops/server/*.sh ops/apps/analyticshub/*.sh; do
            bash -n "$file"
          done
          bash ops/analyticshub help >/dev/null
